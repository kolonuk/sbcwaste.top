# Builds the production image (the root `Dockerfile`) and pushes it to the
# GitHub Container Registry. This workflow does NOT deploy to Google Cloud
# Run — that's google-cloudrun-docker.yml, unchanged by this one. The image
# built here is pulled and run by the `dadock` compose stack on the home
# server, as a self-hosted mirror of the Cloud Run deployment (Redis cache
# instead of Firestore — see README.md#self-hosted-deployment-redis).
#
# No repository secrets are required to build and push: GHCR is
# authenticated with the per-run GITHUB_TOKEN via the `packages: write`
# permission below. DADOCK_DEPLOY_TOKEN (optional, see trigger-dadock-deploy)
# is the only secret this workflow can use.

name: Build and Push Self-hosted Docker Image

on:
  workflow_dispatch: {}
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "static/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/ghcr-docker.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: "read"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sbcwaste.top

jobs:
  trivy-fs:
    name: Scan source for vulnerabilities (Trivy FS)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          exit-code: "1"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  build:
    name: Build, Scan and Push Image
    needs: [trivy-fs]
    runs-on: ubuntu-24.04
    permissions:
      contents: "read"
      packages: "write"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # dadock pins images by an immutable prod-<short sha> tag (same
      # convention as johnwood.dev / daclusta-docs), with :latest as a
      # convenience.
      - name: Compute image tags
        id: meta
        run: |
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-12)"
          IMAGE_BASE="${REGISTRY}/${IMAGE_NAME}"
          echo "short_sha=${SHORT_SHA}"                      >> "$GITHUB_OUTPUT"
          echo "image_base=${IMAGE_BASE}"                    >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_BASE}:prod-${SHORT_SHA}"   >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build locally first so it can be scanned before anything is pushed —
      # a failed scan must never leave a vulnerable image in GHCR.
      - name: Build (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.image_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 18081:8080 "${{ steps.meta.outputs.image_ref }}"
          code=""
          for i in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18081/health || true)"
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "$code" = "200" ] || { echo "/health did not return 200 (got $code)"; docker logs smoke; exit 1; }
          body="$(curl -s http://localhost:18081/health)"
          echo "$body" | grep -q '{"status": "ok"}' || { echo "/health body unexpected: $body"; docker logs smoke; exit 1; }
          docker rm -f smoke

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.meta.outputs.image_ref }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ steps.meta.outputs.image_base }}:latest
          cache-from: type=gha

      - name: Summary
        run: |
          echo "Pushed \`${{ steps.meta.outputs.image_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Update dadock's \`docker-compose.yml\` to pin this tag." >> "$GITHUB_STEP_SUMMARY"

  cleanup-images:
    name: Clean up old container images
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: "write"
    steps:
      - name: Delete all but the 5 most recent versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: "sbcwaste.top"
          package-type: "container"
          # :latest moves with every build, so the newest version always
          # carries it and is inside this keep window — no separate
          # tag-based exclusion needed (v5 has no such input; actionlint
          # flags "ignore-versions-with-tags" as undefined).
          min-versions-to-keep: 5

  trigger-dadock-deploy:
    name: Reload the dadock stack
    needs: build
    runs-on: ubuntu-24.04
    steps:
      # DADOCK_DEPLOY_TOKEN is a fine-grained PAT scoped to Actions:write on
      # kolonuk/dadock only — the default GITHUB_TOKEN can't dispatch
      # workflows in another repo (same token already used by johnwood.dev
      # for the same purpose; set it as a repo secret here too if you want
      # pushes to this repo to auto-reload the dadock stack).
      - name: Dispatch dadock deploy workflow
        env:
          GH_TOKEN: ${{ secrets.DADOCK_DEPLOY_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "DADOCK_DEPLOY_TOKEN not set - skipping dadock reload. Pull the new image manually." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run "1. Deploy docker stack" --repo kolonuk/dadock
