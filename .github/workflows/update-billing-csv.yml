# Keeps static/data/billing_data.csv up to date once a month has closed.
#
# The deployed app (src/billing.go) treats the CSV as the priority source: a month
# recorded in the CSV is never re-fetched from BigQuery. This workflow is what
# actually writes finalized months into the CSV, since the running Cloud Run
# service has no GitHub write access and shouldn't be given any - persisting to
# the repo has to happen from CI, not from the live app.
#
# Auth uses the same keyless Workload Identity Federation as
# google-cloudrun-docker.yml - no service account key is stored anywhere. The
# service account only needs read access to the "bindays" BigQuery dataset
# (BigQuery Data Viewer + Job User on the sbcwaste project) for this job.
#
# Required secrets (shared with google-cloudrun-docker.yml):
# - WIF_PROVIDER
# - WIF_SERVICE_ACCOUNT
#
# Changes are opened as a PR, never pushed straight to main, so a human can add
# a `note` or catch anything odd before the figures go live.

name: Update Billing CSV

on:
  schedule:
    - cron: '0 6 13 * *' # monthly on the 13th at 06:00 UTC
  workflow_dispatch: {}

env:
  PROJECT_ID: sbcwaste
  DATASET_ID: bindays
  CSV_PATH: static/data/billing_data.csv
  BRANCH: automated/update-billing-csv

permissions:
  contents: read
  id-token: write

jobs:
  update-billing-csv:
    name: Sync completed months into billing_data.csv
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Find missing completed months
        id: update
        run: |
          set -euo pipefail

          TABLE=$(bq query --project_id="${PROJECT_ID}" --use_legacy_sql=false --format=csv --headless \
            "SELECT table_name FROM \`${PROJECT_ID}.${DATASET_ID}.INFORMATION_SCHEMA.TABLES\` WHERE STARTS_WITH(table_name, 'gcp_billing_export_v1_') LIMIT 1" \
            | tail -n +2)

          if [ -z "$TABLE" ]; then
            echo "No billing export table found; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Using billing export table: ${TABLE}"

          # Same monthly aggregation the live app runs (src/billing.go's fetchBillingData),
          # so the figures that eventually land in the CSV match what was shown live.
          bq query --project_id="${PROJECT_ID}" --use_legacy_sql=false --format=json \
            "SELECT FORMAT_DATE('%Y-%m', usage_start_time) AS year_month, ROUND(SUM(cost), 2) AS total_cost FROM \`${PROJECT_ID}.${DATASET_ID}.${TABLE}\` GROUP BY 1 ORDER BY 1 ASC" \
            > /tmp/bq_costs.json

          CURRENT_MONTH=$(date -u +%Y-%m)
          changed=false

          while IFS=$'\t' read -r year_month total_cost; do
            if [ "$year_month" == "$CURRENT_MONTH" ]; then
              continue # still open; leave it to be served live from BigQuery
            fi
            if grep -q "^${year_month}," "$CSV_PATH"; then
              continue # CSV already has this month - it wins, per the priority rule
            fi
            echo "${year_month},${total_cost}" >> "$CSV_PATH"
            echo "Added ${year_month}: ${total_cost}"
            changed=true
          done < <(jq -r '.[] | [.year_month, .total_cost] | @tsv' /tmp/bq_costs.json)

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Open pull request with new month(s)
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add "$CSV_PATH"
          git commit -m "Add completed month(s) to billing_data.csv"
          git push --force-with-lease origin "$BRANCH"

          open_count=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$open_count" -eq 0 ]; then
            gh pr create \
              --title "Update billing_data.csv with completed month(s)" \
              --base main \
              --head "$BRANCH" \
              --body "Auto-generated by the Update Billing CSV workflow. Please review the added row(s) — add a \`note\` if relevant — before merging."
          else
            echo "PR already open for $BRANCH; pushed update to it."
          fi
